name: Optional native desktop build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:setup
      - run: pnpm exec turbo run build --filter=@starter/desktop...
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
      - run: pnpm --filter @starter/desktop build:native
        env:
          VITE_API_BASE_URL: https://api.example.com/api/v1
