[package]
name = "project-studio"
version = "0.1.0"
description = "Project Studio desktop workspace"
edition = "2021"
rust-version = "1.90"

[lib]
name = "project_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-fs = "=2.6.0"
